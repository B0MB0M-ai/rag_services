{% if error %}<div class="upload-message upload-message--error" role="alert"><strong>อัปโหลดไม่สำเร็จ</strong><span>{{ error }}</span></div>{% else %}<div class="upload-message upload-message--success" role="status"><strong>อัปโหลด {{ document.filename }} สำเร็จ</strong><span>ไฟล์ถูกเก็บแล้วและอยู่ในสถานะรอจัดทำดัชนีสำหรับ RAG</span><a href="/data">รีเฟรชรายการไฟล์</a></div>{% endif %}
